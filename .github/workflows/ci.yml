name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway -h localhost"
          --health-interval 5s
          --health-retries 10

    env:
      LLM_PROVIDER: fake
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply and match models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -v
