services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway -h localhost"]
      interval: 5s
      retries: 5

  api:
    build: .
    environment:
      LLM_PROVIDER: ollama
      # Ollama працює на Mac нативно (GPU), а не в контейнері
      OLLAMA_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
